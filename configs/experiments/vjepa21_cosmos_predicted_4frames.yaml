experiment:
  name: vjepa21-cosmos-predicted-four-frame-adapter
  seed: 42
  output_dir: outputs/vjepa21_cosmos_predicted_4frames

data:
  archive_repo: anonymousML123/denseworld-115k_archive
  archive_prefix: data
  clips_per_remote_shard: 1000
  local_shard_size: 250
  download_margin_shards: 1
  train_samples: 4500
  val_samples: 500
  local_root: data/jepa_cosmos_5k
  cache_root: data/vjepa21_cosmos_5k_predicted_4frames
  num_frames: 16
  context_frames: 12
  crop_size: 384
  preview_samples: 8
  cache_samples_per_shard: 16
  decode_workers: 8

vjepa21:
  model_id: facebookresearch/vjepa2:vjepa2_1_vit_giant_384
  checkpoint_url: https://dl.fbaipublicfiles.com/vjepa2/vjepa2_1_vitg_384.pt
  checkpoint_path: checkpoints/vjepa2_1_vitg_384.pt
  encoder_checkpoint_key: target_encoder
  dependency_root: deps/vjepa2
  embed_dim: 1408
  feature_levels: 4
  use_final_layer_only: true
  patch_size: 16
  tubelet_size: 2
  predictor_embed_dim: 384
  predictor_depth: 24
  predictor_heads: 12
  predictor_mask_tokens: 8

cosmos:
  model_id: nvidia/Cosmos-0.1-Tokenizer-CV4x8x8
  checkpoint_dir: checkpoints/Cosmos-0.1-Tokenizer-CV4x8x8
  encoder_file: encoder.jit
  decoder_file: decoder.jit
  temporal_compression: 4
  latent_channels: 16
  dtype: bfloat16
  anchor_last_context_frame: true

adapter:
  input_dim: 1408
  hidden_dim: 512
  output_channels: 16
  residual_blocks: 6
  dropout: 0.0

training:
  input_latent: predicted
  selection_metric: predicted_loss
  batch_size: 2
  gradient_accumulation_steps: 8
  epochs: 20
  learning_rate: 0.0002
  min_learning_rate: 0.000002
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_workers: 2
  mixed_precision: bfloat16
  validate_every_optimizer_steps: 150
  decoded_loss_every_steps: 0
  resume: true

overfit:
  samples: 1
  epochs: 3000
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  min_learning_rate: 0.00001
  validate_every_optimizer_steps: 50
  num_workers: 0
  log_validation_videos: true
  push_to_huggingface: false

loss:
  latent_l1: 1.0
  latent_cosine: 0.1
  rgb_l1: 0.0
  perceptual: 0.0
  temporal: 0.0

tracking:
  wandb_entity: aayush21003-indraprastha-institute-of-information-techno
  wandb_project: vjepa21-cosmos-latent-adapter
  run_name: vjepa21-1b-cosmos-predicted-4frames-5k
  log_every_steps: 10
  log_validation_videos: true

huggingface:
  repo_id: Aaypom/vjepa21-cosmos-predicted-4frames-adapter
  private: false
  push_best: true
  push_latest: true
